name: FSD LabHub Runtime Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/fsd_lab_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace
        run: npm install
      - name: Build and smoke-test every experiment
        run: node scripts/runtime-smoke.mjs
